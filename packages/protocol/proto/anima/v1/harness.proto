syntax = "proto3";

package anima.v1;

import "google/protobuf/struct.proto";

// HarnessService exposes agent commands and a reconnectable snapshot stream.
service HarnessService {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc SubmitInput(SubmitInputRequest) returns (SubmitInputResponse);
  rpc WatchConversation(WatchConversationRequest) returns (stream WatchConversationResponse);
  rpc WatchTaskGraph(WatchTaskGraphRequest) returns (stream WatchTaskGraphResponse);
  rpc WatchDocument(WatchDocumentRequest) returns (stream WatchDocumentResponse);
  rpc AbortConversation(AbortConversationRequest) returns (AbortConversationResponse);
  rpc CompactConversation(CompactConversationRequest) returns (CompactConversationResponse);
  rpc GetEntries(GetEntriesRequest) returns (GetEntriesResponse);
  rpc WatchConversations(WatchConversationsRequest) returns (stream WatchConversationsResponse);
  rpc UpdateConversation(UpdateConversationRequest) returns (UpdateConversationResponse);
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc UpdateQueuedInput(UpdateQueuedInputRequest) returns (UpdateQueuedInputResponse);
  rpc ListCrons(ListCronsRequest) returns (ListCronsResponse);
  rpc DeleteCron(DeleteCronRequest) returns (DeleteCronResponse);
  rpc GetSubagentDefaults(GetSubagentDefaultsRequest) returns (GetSubagentDefaultsResponse);
  rpc UpdateSubagentDefaults(UpdateSubagentDefaultsRequest) returns (UpdateSubagentDefaultsResponse);
}

// IDs are opaque strings, scoped to the server's database. They remain valid
// across restarts using the same database; resetting it invalidates existing IDs.
message CreateConversationRequest {
  // Absent: use the server's working directory.
  optional string cwd = 1;
  optional string instructions = 2;
  optional string name = 3;
}

message CreateConversationResponse {
  string conversation_id = 1;
}

// What to do when the conversation already has an active run.
enum BusyBehavior {
  // Use the server's default for the recipient (see SubmitInputRequest).
  BUSY_BEHAVIOR_UNSPECIFIED = 0;
  BUSY_BEHAVIOR_QUEUE = 1;
  BUSY_BEHAVIOR_STEER = 2;
  BUSY_BEHAVIOR_REJECT = 3;
}

message SubmitInputRequest {
  string conversation_id = 1;
  string content = 2;
  // Reusing a nonempty ID in this conversation does not send the input twice.
  optional string request_id = 3;
  // Input goes to the specified conversation. Unspecified means steer.
  BusyBehavior when_busy = 4;
}

// Acknowledges acceptance, not completion. Observe state for progress and results.
message SubmitInputResponse {}

message WatchConversationRequest {
  string conversation_id = 1;
}

message WatchConversationResponse {
  ConversationSnapshot snapshot = 1;
}

// Each message replaces the previous snapshot. The first arrives immediately;
// subsequent messages may coalesce changes. Disconnecting only stops the watch,
// not the run. Reconnect to get current state; updates are not an event log.
message ConversationSnapshot {
  string conversation_id = 1;
  // A bounded transcript window, oldest first. Each object is a complete Durable
  // EntryRecord, preserving model content, tool results, and custom entry data.
  repeated google.protobuf.Struct entries = 2;
  // The entry immediately before the window; absent if there are no older entries.
  optional string before_entry_id = 3;
  // Built-in documents keyed by kind: pi.agent, pi.live, pi.inbox, pi.usage,
  // and pi.provider. pi.live includes streamed generation and tool progress.
  map<string, google.protobuf.Struct> docs = 4;
  // Derived server-side values, not cumulative token/spend totals.
  ConversationStatus status = 5;
}

// Watch every live task in the harness, not just one conversation's foreground run.
message WatchTaskGraphRequest {}

message WatchTaskGraphResponse {
  // A complete Durable TaskGraph: { tasks: { "<id>": TaskGraphNode } }.
  // Nodes include kind, conversationId, owner, state, background, abortRequested,
  // blocked, and owned conversations. Nested IDs keep their numeric representation.
  // Terminal tasks leave the graph. This replaces the previous graph, not a delta.
  google.protobuf.Struct graph = 1;
}

// Watch an existing conversation-scoped singleton document by its registered kind.
// This is generic: built-in and application/extension documents use the same API.
message WatchDocumentRequest {
  string conversation_id = 1;
  string kind = 2;
}

message WatchDocumentResponse {
  // Initial value, then complete replacement values. Absent on retirement.
  google.protobuf.Struct value = 1;
  // Retirement sends one final response with this flag, then ends the stream.
  // Reattaching requires the document to exist again. Missing documents/kinds
  // return not_found; watching never creates a document.
  bool retired = 2;
}

message AbortConversationRequest {
  string conversation_id = 1;
}

// Returned once ordinary foreground work is idle. Background tasks may continue.
message AbortConversationResponse {}

message CompactConversationRequest {
  string conversation_id = 1;
  // Optional guidance for the summary, not a new chat message.
  optional string instructions = 2;
}

// Waits for Durable's compaction task and summary placement. Progress/failures are
// in pi.live; AbortConversation cancels the work. Disconnecting stops only the wait.
message CompactConversationResponse {
  // False if nothing was eligible or a newer context change superseded the summary.
  bool compacted = 1;
}

message GetEntriesRequest {
  string conversation_id = 1;
  // Exclusive upper bound. Absent: return the newest page.
  optional string before_entry_id = 2;
  // Zero uses the server's default page size.
  uint32 limit = 3;
}

message GetEntriesResponse {
  // Complete Durable EntryRecords, oldest first, as in ConversationSnapshot.
  repeated google.protobuf.Struct entries = 1;
  // Pass this as before_entry_id to load the next older page. Absent at the start
  // of history. This is an exclusive bound, unlike the snapshot's marker.
  optional string next_before_entry_id = 2;
}

message ModelRef {
  string provider = 1;
  string model_id = 2;
}

message ConversationStatus {
  string cwd = 1;
  ModelRef model = 2;
  optional string git_branch = 3;
  uint32 context_tokens = 4;
  // Zero when the model is unknown. Context usage is approximate.
  uint32 context_window = 5;
  optional string thinking_level = 6;
  // Ordered choices for the current model. Empty when its capabilities are unknown.
  repeated string supported_thinking_levels = 7;
}

// Display metadata only. Archive does not cancel or delete a conversation.
message ConversationInfo {
  string conversation_id = 1;
  string name = 2;
  bool archived = 3;
  // Absent for human-created coordinators; set to the spawning coordinator for workers.
  optional string owner_conversation_id = 4;
  // Assignment title for a subagent, absent on older conversations.
  optional string task_title = 5;
}

message WatchConversationsRequest {}

message WatchConversationsResponse {
  // Complete replacement directory, including archived conversations.
  repeated ConversationInfo conversations = 1;
}

message UpdateConversationRequest {
  string conversation_id = 1;
  optional string name = 2;
  optional bool archived = 3;
  // Requires idle execution with no queued/pending delivery. Does not move files.
  optional string cwd = 4;
  // Applies to subsequent model requests.
  ModelRef model = 5;
  // Applies to subsequent model requests. Absent leaves the level unchanged,
  // except that changing models clamps the current level to the new model.
  optional string thinking_level = 6;
}

message UpdateConversationResponse {}

message ListDirectoriesRequest {
  // Empty means the server's working directory; ~ means its home directory.
  string path = 1;
  // Best-effort filesystem pagination; reset when changing paths.
  uint32 offset = 2;
}

message Directory {
  string name = 1;
  string path = 2;
}

message ListDirectoriesResponse {
  string path = 1;
  string parent = 2;
  repeated Directory directories = 3;
  optional uint32 next_offset = 4;
}

message ModelInfo {
  ModelRef model = 1;
  string name = 2;
  uint32 context_window = 3;
  bool reasoning = 4;
  repeated string supported_thinking_levels = 5;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message UpdateQueuedInputRequest {
  string conversation_id = 1;
  // Taken from pi.inbox, not a task ID. Only queued user text is editable.
  string submission_id = 2;
  // Compare-and-set: reject if consumed or edited by another client.
  string expected_content = 3;
  BusyBehavior expected_mode = 4;
  optional string content = 5;
  // Only QUEUE and STEER are accepted.
  optional BusyBehavior when_busy = 6;
  bool remove = 7;
}

message UpdateQueuedInputResponse {
  // Exact updated/withdrawn content, for restoring withdrawn text to the editor.
  string content = 1;
  BusyBehavior when_busy = 2;
}

message CronInfo {
  string cron_id = 1;
  string name = 2;
  // Five-field cron expression interpreted in the IANA timezone below.
  string cron = 3;
  string timezone = 4;
  string instruction = 5;
  // Absolute time in ISO 8601 format; absent if scheduling failed.
  optional string next_run_at = 7;
  optional string error = 8;
}

message ListCronsRequest {}

message ListCronsResponse {
  repeated CronInfo crons = 1;
}

message DeleteCronRequest {
  string cron_id = 1;
}

// Stops future runs. An in-progress run may finish.
message DeleteCronResponse {}

message SubagentDefaults {
  ModelRef model = 1;
  string thinking_level = 2;
}

message GetSubagentDefaultsRequest {}

message GetSubagentDefaultsResponse {
  SubagentDefaults defaults = 1;
}

message UpdateSubagentDefaultsRequest {
  ModelRef model = 1;
  string thinking_level = 2;
}

message UpdateSubagentDefaultsResponse {
  SubagentDefaults defaults = 1;
}
